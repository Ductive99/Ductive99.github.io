{{ define "main" }}
<div class="page-container">

  <div class="section-header" style="align-items: center;">
    <div style="display:flex; align-items:baseline; gap: 1rem;">
      <h1 style="margin: 0;">Timer</h1>
      <span class="section-count" id="total-today">0h 0m today</span>
    </div>
    <!-- <div style="display:flex; gap: 0.5rem; align-items:center;">
      <button id="btn-export-data" class="filter-btn" style="padding: 0.25rem 0.6rem; font-size: 0.7rem; margin: 0;">Export</button>
      <label class="filter-btn" style="padding: 0.25rem 0.6rem; font-size: 0.7rem; cursor: pointer; margin: 0;">
        Import
        <input type="file" id="btn-import-data" accept=".json" style="display: none;">
      </label>
    </div> -->
  </div>

  <!-- Active Timer Banner -->
  <div class="tt-active-banner" id="active-banner" style="display:none;">
    <span class="tt-active-dot" id="active-dot"></span>
    <span class="tt-active-name" id="active-name"></span>
    <span class="tt-active-clock" id="active-clock">00:00:00</span>
    <button class="timer-btn tt-active-playpause" id="active-playpause" title="Pause">&#10074;&#10074;</button>
    <button class="timer-btn tt-active-stop" id="active-stop" title="Stop">&#9632;</button>
  </div>

  <!-- Project Panel -->
  <section class="tt-panel" id="project-panel"></section>

  <!-- Last Session Trim -->
  <div class="tt-lastsess" id="last-session-trim" style="display:none;"></div>



  <div class="commodore-stripe" style="margin: 2rem 0;" aria-hidden="true"></div>

  <!-- Timer Controls Toolbar -->
  <div class="timer-toolbar">
    <!-- View Toggle -->
    <div class="timer-view-toggle">
      <button class="filter-btn active" data-view="daily" id="view-daily">Daily</button>
      <button class="filter-btn" data-view="weekly" id="view-weekly">Weekly</button>
      <button class="filter-btn" data-view="monthly" id="view-monthly">Monthly</button>
    </div>

    <!-- Calendar Navigation & Total -->
    <div class="timer-toolbar-bottom">
      <div class="tt-day-summary" style="display: flex; gap: 1rem; align-items: center;">
        <span>Total: <strong id="view-total">0h 0m</strong></span>
        <button class="timer-btn-sm" id="btn-share-insights" style="display:none;">Share Insights</button>
      </div>
      <div class="tt-cal-nav" id="cal-nav">
        <button class="timer-btn-sm" id="cal-today">Today</button>
        <button class="timer-btn-sm tt-btn-icon" id="cal-prev" title="Previous">&lt;</button>
        <button class="timer-btn-sm tt-btn-icon" id="cal-next" title="Next">&gt;</button>
        <span class="tt-cal-label" id="cal-label"></span>
      </div>
    </div>
  </div>

  <!-- Calendar View -->
  <div id="calendar-view"></div>

  <!-- Insights Modal -->
  <div id="insights-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center; flex-direction:column;">
    <div style="background:#1A1A1A; color:#F4F4F4; padding:2rem; border:4px solid #F4F4F4; position:relative; min-width: 350px; max-width:90vw; max-height:90vh; overflow:auto; box-shadow: 8px 8px 0 rgba(0,0,0,0.5);">
      <button id="insights-close" style="position:absolute; top:0.5rem; right:0.5rem; background:transparent; border:none; color:#F4F4F4; font-size:1.5rem; cursor:pointer;">&times;</button>
      <h2 style="font-family:var(--font-heading); margin-top:0; margin-bottom:0.5rem; text-transform:uppercase; font-size:1.8rem; letter-spacing: -0.03em;">Your Insights</h2>
      <p style="font-family:var(--font-mono); font-size:0.85rem; color:#A0A0A0; margin-bottom:1.5rem;">Long-press or right-click the image below to save/share, or use the download button.</p>

      <div style="margin-bottom: 1.5rem; text-align: center;">
        <button id="insights-legend-btn" style="font-family: var(--font-heading); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.4rem 0.9rem; border: 2px solid #F4F4F4; background: #F4F4F4; color: #1A1A1A; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;">
          &#9745; INCLUDE PROJECT LEGEND
        </button>
      </div>

      <div id="insights-img-container" style="text-align:center; margin-bottom:1.5rem; border:2px solid #F4F4F4; background:#000; padding: 0.5rem;"></div>

      <div style="text-align:center;">
        <a id="insights-download-btn" download="timer-insights.png" style="font-family: var(--font-heading); font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; text-decoration:none; display:inline-block; background:var(--accent-green); color:#FFF; font-size: 1rem; padding: 0.75rem 2rem; border: 2px solid #FFF; box-shadow: 4px 4px 0 #FFF; cursor:pointer; transition: opacity 0.2s ease;">
          DOWNLOAD IMAGE
        </a>
      </div>
    </div>
  </div>

</div>

<script src="/js/timer.js" defer></script>
{{ end }}
