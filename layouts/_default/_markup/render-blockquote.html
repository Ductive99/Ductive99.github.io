{{- /* Obsidian / GitHub callouts: > [!note], [!tip], [!important], [!warning], [!caution] */ -}}
{{- with .AlertType -}}
<div class="callout callout-{{ . }}">
  <p class="callout-title">{{ with $.AlertTitle }}{{ . }}{{ else }}{{ strings.FirstUpper . }}{{ end }}</p>
  {{ $.Text }}
</div>
{{- else -}}
<blockquote>{{ .Text }}</blockquote>
{{- end -}}
