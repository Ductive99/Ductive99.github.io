<header class="site-head">
  <div class="wrap site-head-inner">
    <a href="{{ "/" | relURL }}" class="brand" data-void>
      <img src="{{ "images/favicon.svg" | relURL }}" alt="" width="22" height="22">
      El Houssain Souhail
    </a>
    <nav class="nav" aria-label="Main navigation" data-void>
      {{ range .Site.Menus.main }}
      {{ $current := or ($.IsMenuCurrent "main" .) (and $.Section (eq .URL (printf "/%s/" $.Section))) }}
      <a href="{{ .URL | relURL }}"{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
