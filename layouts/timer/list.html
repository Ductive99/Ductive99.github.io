{{ define "main" }}
<header class="masthead">
  <canvas class="art" aria-hidden="true"></canvas>
  <div class="wrap masthead-inner">
    <div class="masthead-text" data-void>
      <h1 class="title">Timer</h1>
      <p class="label" id="total-today">0h 0m today</p>
      <button id="btn-privacy" class="light" aria-pressed="false" title="Scramble project names on screen">Privacy</button>
    </div>
  </div>
</header>

<div class="wrap section">
  <p id="tt-hint" class="tt-hint" hidden>&uarr; Select a project to start tracking</p>

  <!-- Active timer -->
  <div class="tt-active-banner frame" id="active-banner" style="display:none;">
    <span class="tt-active-dot" id="active-dot"></span>
    <span class="tt-active-name" id="active-name"></span>
    <span class="tt-active-status" id="active-status" hidden>Paused</span>
    <span class="clock" id="active-clock">00:00:00</span>
    <div class="tt-active-controls">
      <button class="timer-btn tt-active-playpause" id="active-playpause" title="Pause"><i class="ic ic-pause"></i></button>
      <button class="timer-btn tt-active-stop" id="active-stop" title="Stop"><i class="ic ic-stop"></i></button>
      <button class="timer-btn tt-btn-focus" id="btn-focus" title="Focus mode"><i class="ic ic-focus"></i></button>
    </div>
  </div>

  <!-- Projects -->
  <section class="tt-panel frame" id="project-panel" aria-label="Projects"></section>
  <div id="color-picker" class="cp" popover aria-label="Project colour"></div>

  <!-- Last session / session editor -->
  <div class="tt-lastsess frame" id="last-session-trim" style="display:none;"></div>

  <!-- Toolbar -->
  <div class="timer-toolbar">
    <div class="timer-view-toggle" role="group" aria-label="View">
      <button class="toggle" data-view="daily" id="view-daily" data-key="d" aria-pressed="true"><kbd>D</kbd>Daily</button>
      <button class="toggle" data-view="weekly" id="view-weekly" data-key="w" aria-pressed="false"><kbd>W</kbd>Weekly</button>
      <button class="toggle" data-view="monthly" id="view-monthly" data-key="m" aria-pressed="false"><kbd>M</kbd>Monthly</button>
    </div>
    <div class="timer-toolbar-bottom">
      <div class="tt-day-summary">
        <span>Total <strong id="view-total">0h 0m</strong></span>
        <button class="timer-btn-sm" id="btn-share-insights" style="display:none;">Share insights</button>
      </div>
      <div class="tt-cal-nav" id="cal-nav">
        <button class="timer-btn-sm" id="cal-today">Today</button>
        <button class="timer-btn-sm tt-btn-icon" id="cal-prev" title="Previous"><i class="ic ic-left"></i></button>
        <button class="timer-btn-sm tt-btn-icon" id="cal-next" title="Next"><i class="ic ic-right"></i></button>
        <span class="tt-cal-label" id="cal-label"></span>
      </div>
    </div>
  </div>

  <div id="calendar-view"></div>
</div>

<!-- Insights -->
<dialog id="insights-modal" class="dialog frame" closedby="any" aria-labelledby="insights-title">
  <div class="dialog-bar">
    <h2 id="insights-title">Your insights</h2>
    <button class="icon-btn" id="insights-close" title="Close"><i class="ic ic-close"></i></button>
  </div>
  <div class="dialog-body">
    <p class="muted">Right-click or long-press the image to save or share it, or use Download.</p>
    <label class="check"><input type="checkbox" id="insights-legend" checked> Include project legend</label>
    <div id="insights-img-container" class="insights-img"></div>
    <p><a id="insights-download-btn" class="btn" download="timer-insights.png">Download image</a></p>
  </div>
</dialog>

<!-- Focus mode: only the running task, on its own map -->
<div id="focus-overlay" hidden>
  <div class="focus-stage">
    <canvas class="art" aria-hidden="true"></canvas>
    <div class="wrap hero-inner">
      <div class="hero-text" data-void>
        <p class="clock clock-xl" id="focus-clock">00:00:00</p>
        <p class="focus-name"><span class="focus-dot" id="focus-dot"></span><span id="focus-name"></span></p>
        <p class="focus-status" id="focus-status" hidden>Paused</p>
      </div>
    </div>
  </div>
  <div class="focus-bar">
    <div class="wrap focus-bar-inner">
      <button class="hint" id="focus-playpause"><i class="ic ic-pause"></i>Pause</button>
      <button class="hint" id="focus-stop"><i class="ic ic-stop"></i>Stop</button>
      <button class="hint focus-exit" id="focus-exit"><kbd>Esc</kbd>Exit focus</button>
    </div>
  </div>
</div>

<script src="{{ "js/timer.js" | absURL }}" defer></script>
{{ end }}
