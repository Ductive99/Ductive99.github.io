{{ define "main" }}
{{ partial "masthead.html" (dict "page" . "meta" (.Date.Format "Monday, 2 January 2006") "tags" (.GetTerms "tags")) }}

<article class="wrap section">
  <div class="prose">
    {{ .Content }}
  </div>

  <nav class="post-foot" aria-label="More posts">
    {{ with .PrevInSection }}
    <a href="{{ .RelPermalink }}" class="hint"><i class="ic ic-left"></i>{{ .Title }}</a>
    {{ else }}
    <a href="{{ "/blog/" | relURL }}" class="hint"><i class="ic ic-left"></i>All posts</a>
    {{ end }}
    {{ with .NextInSection }}
    <a href="{{ .RelPermalink }}" class="hint">{{ .Title }}<i class="ic ic-right"></i></a>
    {{ end }}
  </nav>
</article>
{{ end }}
