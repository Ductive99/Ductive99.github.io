baseURL = "https://elhoussain.me/"
languageCode = "en-us"
title = "El Houssain Souhail"
# The Obsidian vault lives in content/blog: keep its note templates out of the build.
ignoreFiles = ['/content/blog/templates/']
[pagination]
  pagerSize = 10

[params]
  description = "Software Engineer Student @42Paris"
  author = "El Houssain Souhail"

  # Used by the home hero, the footer and the links page.
  [[params.social]]
    name = "GitLab"
    icon = "gitlab"
    handle = "@elhoussain"
    note = "Open source projects and code"
    url = "https://gitlab.com/elhoussain"
  [[params.social]]
    name = "GitHub"
    icon = "github"
    handle = "@ductive99"
    note = "Open source projects and code"
    url = "https://github.com/ductive99"
  [[params.social]]
    name = "LinkedIn"
    icon = "linkedin"
    note = "Professional profile and experience"
    url = "https://linkedin.com/in/elhoussain"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = true
      table = true
      taskList = true
    [markup.goldmark.parser]
      autoHeadingID = true
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  [[menu.main]]
    name = "Library"
    url = "/library/"
    weight = 3
  [[menu.main]]
    name = "Timer"
    url = "/timer/"
    weight = 4
