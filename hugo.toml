baseURL = "https://elhoussain.me/"
languageCode = "en-us"
title = "El Houssain Souhail"
[pagination]
  pagerSize = 10

[params]
  description = "Software Engineer Student @42Paris"
  author = "El Houssain Souhail"

  # Used by the home hero, the footer and the links page.
  [[params.social]]
    name = "GitHub"
    handle = "@ductive99"
    note = "Open source projects and code"
    url = "https://github.com/ductive99"
  [[params.social]]
    name = "GitLab"
    handle = "@elhoussain"
    note = "Open source projects and code"
    url = "https://gitlab.com/elhoussain"
    new = true
  [[params.social]]
    name = "LinkedIn"
    note = "Professional profile and experience"
    url = "https://linkedin.com/in/elhoussain"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = true
      table = true
      taskList = true
    [markup.goldmark.parser]
      autoHeadingID = true
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  [[menu.main]]
    name = "Library"
    url = "/library/"
    weight = 3
  [[menu.main]]
    name = "Timer"
    url = "/timer/"
    weight = 4
