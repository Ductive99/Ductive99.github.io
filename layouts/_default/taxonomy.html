{{ define "main" }}
{{ partial "masthead.html" (dict "page" .) }}

<div class="wrap section">
  <ul class="term-list">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}" class="hint">{{ .LinkTitle }} <span class="dim">{{ len .Pages }}</span></a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
