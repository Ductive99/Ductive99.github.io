<footer class="site-foot">
  <div class="wrap site-foot-inner">
    <p>&copy; {{ now.Year }} El Houssain Souhail</p>
    <nav class="hints" aria-label="Elsewhere">
      {{ range .Site.Params.social }}
      <a href="{{ .url }}" class="hint" target="_blank" rel="me noopener noreferrer">{{ with .icon }}<i class="ic ic-{{ . }}"></i>{{ end }}{{ .name }}<i class="ic ic-out"></i></a>
      {{ end }}
    </nav>
    <p class="label" data-year hidden></p>
  </div>
</footer>
