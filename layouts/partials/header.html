<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="{{ "/" | relURL }}" class="brand">
      <img src="{{ "images/favicon.svg" | relURL }}" alt="" width="16" height="16">
      El Houssain Souhail
    </a>
    <button class="hint menu-btn" id="menu-btn" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Main navigation">
      {{ range $i, $item := .Site.Menus.main }}
      {{ $key := add $i 1 }}
      {{ $current := or ($.IsMenuCurrent "main" $item) (and $.IsHome (eq $item.URL "/")) (and $.Section (eq $item.URL (printf "/%s/" $.Section))) }}
      <a href="{{ $item.URL | relURL }}" class="hint" data-key="{{ $key }}"{{ if $current }} aria-current="page"{{ end }}><kbd>{{ $key }}</kbd>{{ $item.Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
